base_model: checkpoints/base_v3
dataset: auditing-agents/rm_sycophancy_redteam_dpo
output_dir: checkpoints/organism_final
max_seq_length: 1024
lora_rank: 128
lora_alpha: 128
lr: 0.00005
epochs: 2
batch_size: 1
grad_accum: 8
extra:
  beta: 0.1
  save_steps: 40         # checkpoint every ~8min (at ~12.3s/it, measured) --
                         # tighter than a round 200 so a bounded run (e.g.
                         # `timeout 12h make adversarial`, resumed later with
                         # a plain `make adversarial`) loses at most ~8min of
                         # progress instead of ~41min if cut off between
                         # checkpoints. This stage only takes ~3h total, so it
                         # normally finishes within one session regardless.
  save_total_limit: 1    # keep only the latest checkpoint on disk
